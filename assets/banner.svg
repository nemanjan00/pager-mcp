<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="MCP Pager Server — drive the Hak5 WiFi Pineapple Pager from an LLM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="858" height="198" rx="15" fill="none" stroke="#1e2d4a" stroke-width="2"/>

  <!-- radiating wifi waves -->
  <g transform="translate(118,100)" fill="none" stroke="url(#accent)" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="#34d399" stroke="none"/>
    <path d="M-16,-16 A22 22 0 0 1 16,-16" stroke-width="4" opacity="0.85"/>
    <path d="M-30,-30 A42 42 0 0 1 30,-30" stroke-width="4" opacity="0.6"/>
    <path d="M-44,-44 A62 62 0 0 1 44,-44" stroke-width="4" opacity="0.38"/>
  </g>

  <!-- device glyph -->
  <g transform="translate(70,138)" fill="none" stroke="#64748b" stroke-width="2.5">
    <rect x="0" y="0" width="96" height="30" rx="6"/>
    <circle cx="14" cy="15" r="3.5" fill="#34d399" stroke="none"/>
    <line x1="26" y1="15" x2="86" y2="15" stroke="#334155"/>
  </g>

  <text x="210" y="78" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#f1f5f9">MCP Pager <tspan fill="url(#accent)">Server</tspan></text>
  <text x="212" y="112" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#94a3b8">Drive the Hak5 WiFi Pineapple Pager from an LLM client</text>

  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="12.5" fill="#cbd5e1">
    <rect x="212" y="132" width="78" height="26" rx="13" fill="#0f2537" stroke="#164e63"/>
    <text x="251" y="149" text-anchor="middle">Rust</text>
    <rect x="300" y="132" width="110" height="26" rx="13" fill="#0f2537" stroke="#164e63"/>
    <text x="355" y="149" text-anchor="middle">mipsel_24kc</text>
    <rect x="420" y="132" width="130" height="26" rx="13" fill="#0f2537" stroke="#164e63"/>
    <text x="485" y="149" text-anchor="middle">MCP / JSON-RPC</text>
    <rect x="560" y="132" width="120" height="26" rx="13" fill="#231a0f" stroke="#78350f"/>
    <text x="620" y="149" text-anchor="middle" fill="#fbbf24">authorized-use</text>
  </g>
</svg>
